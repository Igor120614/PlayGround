<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yemen City — Будівельник міста</title>
  <style>
    :root { --ink:#3a2d25; --cream:#f6edda; --gold:#d9a441; --green:#657b55; --red:#9b4b3e; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; font-family:Georgia,"Times New Roman",serif; color:var(--ink); background:#d5c69e; }
    #game { position:relative; width:100vw; height:100vh; overflow:hidden; }
    canvas { position:absolute; inset:0; width:100%; height:100%; }
    .topbar { position:absolute; z-index:4; left:18px; right:18px; top:14px; height:68px; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
    .brand { height:68px; min-width:270px; padding:9px 18px 8px 64px; border:2px solid #8e6d43; background:rgba(246,237,218,.94); box-shadow:0 5px 16px rgba(61,42,25,.18); clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%); }
    .brand:before { content:""; position:absolute; left:14px; top:12px; width:39px; height:39px; border:2px solid #987344; border-radius:50%; background:linear-gradient(135deg,#bd8c47 50%,#eee0be 50%); }
    .brand h1 { margin:0; font-size:21px; letter-spacing:.5px; }
    .brand p { margin:3px 0 0; font-size:12px; color:#806d54; }
    .resources { display:flex; gap:8px; pointer-events:auto; }
    .resource { min-width:120px; height:52px; display:flex; align-items:center; gap:9px; padding:7px 12px; background:rgba(246,237,218,.96); border:1px solid #9d8060; box-shadow:0 4px 12px rgba(61,42,25,.15); }
    .resource .icon { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:#dec796; font-family:Arial,sans-serif; font-weight:bold; }
    .resource b { display:block; font-size:18px; } .resource small { color:#806d54; font-size:11px; }
    .panel { position:absolute; z-index:5; left:18px; bottom:18px; width:244px; background:rgba(246,237,218,.96); border:2px solid #967653; box-shadow:0 8px 24px rgba(61,42,25,.22); }
    .panel h2 { margin:0; padding:10px 14px; font-size:14px; background:#d7c49a; border-bottom:1px solid #967653; letter-spacing:.8px; }
    .buildings { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; }
    .building { position:relative; height:86px; border:1px solid #b49a72; background:#ede1c5; cursor:pointer; text-align:center; padding:7px 4px 4px; transition:.15s; }
    .building:hover { transform:translateY(-2px); background:#f7edda; border-color:#805e3c; }
    .building.selected { outline:3px solid #ca9b45; background:#fff5dc; }
    .building .pic { height:45px; display:grid; place-items:center; font-size:31px; }
    .building strong { display:block; font-size:12px; } .building small { color:#7b664c; font-size:10px; }
    .status { position:absolute; z-index:5; right:18px; bottom:18px; width:280px; padding:13px 15px; background:rgba(246,237,218,.94); border:1px solid #967653; box-shadow:0 8px 24px rgba(61,42,25,.18); }
    .status h3 { margin:0 0 8px; font-size:14px; } .bar { height:8px; background:#cab98e; margin:7px 0 10px; overflow:hidden; } .bar i { display:block; height:100%; width:45%; background:var(--green); transition:width .25s; }
    .tip { position:absolute; z-index:6; left:50%; bottom:26px; transform:translateX(-50%); padding:9px 14px; border:1px solid #967653; background:rgba(246,237,218,.95); font-size:12px; opacity:0; transition:.2s; }
    .tip.show { opacity:1; }
  </style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>
  <div class="topbar">
    <div class="brand"><h1>Місто Діяр</h1><p>Керівництво відновленням міста</p></div>
    <div class="resources">
      <div class="resource"><div class="icon">ج</div><div><b id="coins">1 240</b><small>Золоті монети</small></div></div>
      <div class="resource"><div class="icon" style="background:#c8d09c">♟</div><div><b id="people">42</b><small>Жителі</small></div></div>
    </div>
  </div>
  <aside class="panel">
    <h2>БУДУВАННЯ</h2>
    <div class="buildings">
      <button class="building" data-type="house"><div class="pic">⌂</div><strong>Будинок</strong><small>80 монет</small></button>
      <button class="building" data-type="market"><div class="pic">▦</div><strong>Ринок</strong><small>120 монет</small></button>
      <button class="building" data-type="well"><div class="pic">◉</div><strong>Колодязь</strong><small>60 монет</small></button>
      <button class="building" data-type="garden"><div class="pic">♧</div><strong>Сад</strong><small>50 монет</small></button>
    </div>
  </aside>
  <aside class="status">
    <h3>Добробут міста</h3>
    <div class="bar"><i id="happiness"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:12px"><span>Щастя мешканців</span><b id="happyText">45%</b></div>
  </aside>
  <div class="tip" id="tip">Оберіть місце на рівній ділянці</div>
</div>
<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize);resize();
let coins=1240,people=42,happiness=45,selected=null;
const buildings=[];
const costs={house:80,market:120,well:60,garden:50};
function iso(x,y,z=0){ const cx=W/2, cy=H*.08; return [cx+(x-y)*58,cy+(x+y)*29-z]; }
function poly(points,fill,stroke){ ctx.beginPath(); points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();} }
function tile(x,y,fill){const c=iso(x,y); const p=[[c[0],c[1]],iso(x+1,y),iso(x+1,y+1),iso(x,y+1)];poly(p,fill,'rgba(92,74,48,.14)');}
function drawHouse(x,y,large=false){let c=iso(x+.5,y+.5,5), s=large?1.25:1;ctx.save();ctx.translate(c[0],c[1]);ctx.scale(s,s);
  poly([[-31,18],[0,29],[31,17],[31,-17],[0,-7],[-31,-19]],'#ad7f4d','#6e4d35');poly([[-31,-19],[0,-7],[31,-17],[31,-31],[0,-43],[-31,-31]],'#d2b078','#80603e');
  poly([[-31,-19],[0,-7],[0,-43],[-31,-31]],'#b98c57','#80603e');poly([[31,-17],[0,-7],[0,-43],[31,-31]],'#cfae78','#80603e');
  poly([[-38,-30],[0,-48],[38,-29],[0,-7]],'#d4bc86','#80603e');poly([[-38,-30],[0,-7],[0,-18],[-38,-41]],'#a97948','#80603e');poly([[38,-29],[0,-7],[0,-18],[38,-41]],'#c4955e','#80603e');
  poly([[-7,7],[7,11],[7,-17],[-7,-21]],'#5b4938');ctx.restore();}
function drawMarket(x,y){let c=iso(x+.5,y+.5,5);ctx.save();ctx.translate(c[0],c[1]);
 poly([[-34,12],[0,25],[34,12],[34,-16],[0,-29],[-34,-16]],'#b78d57');poly([[-34,-16],[0,-29],[34,-16],[34,-29],[0,-43],[-34,-29]],'#d7bd7d');
 poly([[-38,-28],[0,-45],[38,-27],[0,-9]],'#9c513f','#704536');ctx.fillStyle='#f0dfb3';for(let i=-28;i<=20;i+=16){ctx.fillRect(i,-25,11,16)}ctx.restore();}
function drawWell(x,y){let c=iso(x+.5,y+.5,4);ctx.save();ctx.translate(c[0],c[1]);ctx.fillStyle='#7d8b72';ctx.beginPath();ctx.ellipse(0,0,25,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a6b0a1';ctx.beginPath();ctx.ellipse(0,-3,15,7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#765a3b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-18,-3);ctx.lineTo(-18,-32);ctx.moveTo(18,-3);ctx.lineTo(18,-32);ctx.moveTo(-22,-32);ctx.lineTo(22,-32);ctx.stroke();ctx.restore();}
function drawGarden(x,y){let c=iso(x+.5,y+.5,2);ctx.save();ctx.translate(c[0],c[1]);ctx.fillStyle='#8e7a4f';ctx.fillRect(-28,-4,56,16);for(let i=-20;i<=20;i+=13){ctx.fillStyle=i%26? '#6e7d52':'#7f925c';ctx.beginPath();ctx.arc(i,-2+(i%10),6,0,7);ctx.fill();}ctx.restore();}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#aeb9b0');sky.addColorStop(.55,'#d7cfaa');sky.addColorStop(1,'#b3a269');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8e9a84';ctx.beginPath();ctx.moveTo(0,H*.56);ctx.lineTo(W*.16,H*.42);ctx.lineTo(W*.32,H*.49);ctx.lineTo(W*.52,H*.35);ctx.lineTo(W*.7,H*.48);ctx.lineTo(W*.86,H*.38);ctx.lineTo(W,H*.47);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle='#7d896e';ctx.beginPath();ctx.moveTo(0,H*.62);ctx.lineTo(W*.23,H*.48);ctx.lineTo(W*.43,H*.58);ctx.lineTo(W*.66,H*.44);ctx.lineTo(W,H*.53);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  for(let y=0;y<10;y++)for(let x=0;x<13;x++){let shade=(x+y)%2?'#bcae78':'#c8ba86';tile(x-6,y-2,shade)}
  buildings.sort((a,b)=>a.x+a.y-(b.x+b.y)).forEach(b=>{if(b.type==='house')drawHouse(b.x,b.y);if(b.type==='market')drawMarket(b.x,b.y);if(b.type==='well')drawWell(b.x,b.y);if(b.type==='garden')drawGarden(b.x,b.y);});
  requestAnimationFrame(draw);
}
function invIso(px,py){let cx=W/2,cy=H*.08;let dx=(px-cx),dy=(py-cy);let x=(dx/58+dy/29)/2,y=(dy/29-dx/58)/2;return [Math.floor(x),Math.floor(y)];}
function updateUI(){document.getElementById('coins').textContent=coins.toLocaleString('uk-UA');document.getElementById('people').textContent=people;document.getElementById('happiness').style.width=happiness+'%';document.getElementById('happyText').textContent=happiness+'%';}
document.querySelectorAll('.building').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.building').forEach(b=>b.classList.remove('selected'));if(selected===btn.dataset.type){selected=null}else{selected=btn.dataset.type;btn.classList.add('selected');document.getElementById('tip').classList.add('show');setTimeout(()=>document.getElementById('tip').classList.remove('show'),1800)}});
canvas.addEventListener('click',e=>{if(!selected)return;let [x,y]=invIso(e.clientX,e.clientY);if(x<-6||x>6||y<-2||y>7)return;if(buildings.some(b=>b.x===x&&b.y===y))return;let cost=costs[selected];if(coins<cost){document.getElementBy('tip').textContent='Недостатньо монет';return;}coins-=cost;buildings.push({x,y,type:selected});if(selected==='house'){people+=4;happiness=Math.min(100,happiness+3)}if(selected==='market'||selected==='garden')happiness=Math.min(100,happiness+5);if(selected==='well')happiness=Math.min(100,happiness+4);updateUI();});
// Starter village
[[ -3,-1,'house'],[-1,-1,'house'],[1,-1,'house'],[-2,1,'market'],[1,1,'well'],[3,0,'garden'],[3,3,'house']].forEach(b=>buildings.push({x:b[0],y:b[1],type:b[2]}));
updateUI();draw();
</script>
</body>
</html>
