<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Воля міста — містобудування</title>
<style>
:root{--ink:#f1ead6;--paper:#171914;--panel:#22251c;--gold:#d9bd72;--green:#87966b;--red:#bd604d}
*{box-sizing:border-box}body{margin:0;background:#11130f;color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#app{height:100dvh;display:grid;grid-template-rows:68px 1fr 92px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#1b1e17;border-bottom:1px solid #555940}.brand{display:flex;align-items:center;gap:12px}.seal{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:24px}.brand h1{margin:0;font-size:21px;letter-spacing:.08em}.brand small{color:#aaa58f}.stats{display:flex;gap:8px}.stat{min-width:78px;padding:7px 9px;border-left:1px solid #484a3d;background:#20231a}.stat b{display:block;font:700 12px Arial;color:#aaa58f;text-transform:uppercase}.stat span{font:700 18px Arial}.stat.red span{color:#ffb69c}.stat.blue span{color:#aebeca}
#world{position:relative;overflow:hidden;background:linear-gradient(145deg,#596248,#697259);cursor:crosshair}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(6,1fr);padding:12px 18px 38px}.tile{position:relative;border:1px solid rgba(37,42,29,.16);display:grid;place-items:center;user-select:none}.tile:nth-child(3n){background:rgba(179,178,135,.06)}.tile:nth-child(7n){background:rgba(51,65,45,.12)}.tile:hover{box-shadow:inset 0 0 0 2px rgba(217,189,114,.7)}.build{font-size:clamp(24px,4vh,42px);filter:drop-shadow(2px 4px 2px rgba(20,20,10,.35));animation:rise .28s ease-out}@keyframes rise{from{transform:translateY(14px) scale(.7);opacity:0}}.building-label{position:absolute;bottom:3px;font:700 9px Arial;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 1px 2px #fff;background:rgba(24,28,19,.72);color:#fff;padding:2px 4px}.road{font-size:28px;opacity:.72}.ruin{filter:grayscale(1);opacity:.6}
.skyline{position:absolute;left:0;right:0;bottom:0;height:42px;background:linear-gradient(transparent,rgba(21,25,18,.78));pointer-events:none}.river{position:absolute;right:-10%;top:-18%;width:22%;height:145%;background:rgba(78,103,108,.55);transform:rotate(9deg);border-left:3px solid rgba(215,215,180,.16)}
.bottom{background:#181b15;border-top:1px solid #555940;display:flex;align-items:center;gap:10px;padding:10px 14px}.palette{display:flex;gap:8px;overflow-x:auto;flex:1}.card{min-width:112px;height:72px;border:1px solid #555940;background:#24271e;color:var(--ink);padding:7px 9px;text-align:left;cursor:pointer;position:relative}.card:hover,.card.active{border-color:var(--gold);background:#303329}.card b{display:block;font-size:14px}.card small{display:block;color:#aaa58f;margin-top:5px}.card .cost{position:absolute;right:7px;bottom:6px;color:var(--gold);font:700 11px Arial}.card.demolish{min-width:76px;text-align:center}.card.demolish b{margin-top:5px}.turn{width:150px;height:72px;border:1px solid #d5bd79;background:#8b7948;color:#fff;font:bold 16px Georgia;cursor:pointer}.turn:hover{background:#a28e55}.turn:disabled{opacity:.5;cursor:not-allowed}
#log{position:absolute;left:16px;bottom:48px;width:min(340px,calc(100% - 32px));font:12px Arial;color:#e8e3cc;pointer-events:none}.message{background:rgba(20,22,16,.88);border-left:3px solid var(--gold);padding:7px 9px;margin-top:5px;animation:fade 8s forwards}@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
.modal{position:fixed;z-index:20;inset:0;background:rgba(10,12,9,.84);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{max-width:520px;background:#24271e;border:1px solid var(--gold);padding:28px;text-align:center;box-shadow:0 20px 60px #000}.dialog h2{margin:0 0 10px;font-size:28px}.dialog p{line-height:1.55;color:#d4d0bc}.dialog button{margin-top:10px;border:1px solid var(--gold);background:#3b402f;color:#fff;padding:11px 18px;font:bold 14px Arial;cursor:pointer}
@media(max-width:700px){#app{grid-template-rows:58px 1fr 86px}.top{padding:6px 8px}.seal{display:none}.brand h1{font-size:15px}.brand small{display:none}.stats{gap:3px}.stat{min-width:55px;padding:5px}.stat b{font-size:9px}.stat span{font-size:14px}.grid{padding:5px}.bottom{padding:7px 5px}.card{min-width:94px;height:66px}.turn{width:92px;height:66px;font-size:13px}.building-label{display:none}}
</style>
</head>
<body><div id="app">
<header class="top"><div class="brand"><div class="seal">✚</div><div><h1>ВОЛЯ МІСТА</h1><small>Керманич міста — 1942 рік</small></div></div><div class="stats">
<div class="stat"><b>Тиждень</b><span id="week">1</span></div><div class="stat blue"><b>Люди</b><span id="people">18</span></div><div class="stat"><b>Їжа</b><span id="food">32</span></div><div class="stat red"><b>Настрій</b><span id="morale">60</span></div></div></header>
<main id="world"><div class="river"></div><div id="grid" class="grid"></div><div id="log"></div><div class="skyline"></div></main>
<footer class="bottom"><div class="palette" id="palette"></div><button id="turn" class="turn">Завершити тиждень</button></footer>
</div><div id="modal" class="modal"><div class="dialog"><h2 id="mtitle"></h2><p id="mtext"></p><button id="mbutton">Продовжити</button></div></div>
<script>
const types={house:{name:'Хата',icon:'⌂',cost:{food:4},kind:'house'},farm:{name:'Город',icon:'♧',cost:{food:2},kind:'farm'},school:{name:'Школа',icon:'▥',cost:{food:8},kind:'school'},clinic:{name:'Шпиталь',icon:'✚',cost:{food:10},kind:'clinic'},road:{name:'Дорога',icon:'▰',cost:{food:1},kind:'road'}};
let state={week:1,people:18,food:32,morale:60,selected:'house',cells:Array(60).fill(null)};
const grid=document.getElementById('grid'),palette=document.getElementById('palette'),log=document.getElementById('log');
function init(){for(let i=0;i<60;i++){let d=document.createElement('div');d.className='tile';d.onclick=()=>build(i);grid.appendChild(d)};if(innerWidth>700){state.cells[11]={kind:'house'};state.cells[12]={kind:'house'};state.cells[21]={kind:'farm'};state.cells[22]={kind:'farm'};state.cells[32]={kind:'clinic'};state.cells[31]={kind:'road'};state.cells[41]={kind:'school'};state.cells[30]={kind:'road'}}render()}
function render(){document.getElementById('week').textContent=state.week;document.getElementById('people').textContent=state.people;document.getElementById('food').textContent=state.food;document.getElementById('morale').textContent=state.morale;[...grid.children].forEach((tile,i)=>{tile.innerHTML='';let c=state.cells[i];if(c){let s=document.createElement('span');s.className='build'+(c.kind==='road'?' road':'');s.textContent=c.kind==='road'?'▰':types[c.kind].icon;tile.appendChild(s);if(c.kind!=='road'){let l=document.createElement('span');l.className='building-label';l.textContent=types[c.kind].name;tile.appendChild(l)}}});palette.innerHTML='';Object.entries(types).forEach(([k,t])=>{let b=document.createElement('button');b.className='card'+(state.selected===k?' active':'');b.innerHTML=`<b>${t.icon} ${t.name}</b><small>Житло/підтримка</small><span class="cost">Їжа −${t.cost.food}</span>`;b.onclick=()=>{state.selected=k;render()};palette.appendChild(b)});let d=document.createElement('button');d.className='card demolish';d.innerHTML='<b>×</b><small>Знести</small>';d.onclick=()=>{state.selected=null;render()};palette.appendChild(d)}
function build(i){if(state.selected===null){if(state.cells[i]){state.cells[i]=null;note('Ділянку звільнено')}}else{let t=types[state.selected];if(state.cells[i])return note('Спершу звільніть ділянку');if(state.food<t.cost.food)return note('Недостатньо їжі для будівництва');state.food-=t.cost.food;state.cells[i]={kind:state.selected};note(`${t.name} зведено`)}render()}
function note(s){let m=document.createElement('div');m.className='message';m.textContent=s;log.prepend(m)}
function endWeek(){let farms=state.cells.filter(c=>c?.kind==='farm').length,houses=state.cells.filter(c=>c?.kind==='house').length,clinics=state.cells.filter(c=>c?.kind==='clinic').length,schools=state.cells.filter(c=>c?.kind==='school').length,roads=state.cells.filter(c=>c?.kind==='road').length;let gains=farms*5+roads*2-houses*2-schools*1-clinics*2;state.food=Math.max(0,state.food+gains);if(gains>=0)state.people+=houses*1;else state.people=Math.max(8,state.people-1);state.morale+=farms+schools-clinics*-1-1;state.morale=Math.max(0,Math.min(100,state.morale));state.week++;let events=['У місті пройшов тихий день','Окупаційна комендатура оприлюднила нове розпорядження','На ринку з’явилося трохи продовольства','Приїхали біженці з сусіднього району','Велосипедист приніс звістку з околиць'];note(events[Math.floor(Math.random()*events.length)]);if(state.people<10||state.food<0||state.morale<=0)showModal('Місто не витримало','Запасів чи довіри бракує. Спробуйте збалансувати їжу, хати й підтримку мешканців','Нова спроба',()=>location.reload());else if(state.week>=13)showModal('Місто вистояло','Протягом дванадцяти важких тижнів ви зберегли спільноту, житло та надію. Місто пам’ятатиме тих, хто залишився поруч.','Грати знову',()=>location.reload());render()}
document.getElementById('turn').onclick=endWeek;
function showModal(title,text,button,fn){document.getElementById('mtitle').textContent=title;document.getElementById('mtext').textContent=text;document.getElementById('mbutton').textContent=button;document.getElementById('mbutton').onclick=fn;document.getElementById('modal').classList.add('show')}
window.onload=()=>showModal('Захистіть щоденне життя','1942 рік. Ви керуєте невеликим містом під окупаційною владою. Будуйте хати, городи, дорогу, школу й шпиталь. Протягом 12 тижнів тримайте їжу й настрій мешканців.','Розпочати гру',()=>{document.getElementById('modal').classList.remove('show')});init();
</script></body></html>
